<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found: Widgetdeck</title>
<meta name="description" content="That page doesn't exist on widgetdeck.com. Head back to the apps.">
<!-- A 404 in search results helps nobody. -->
<meta name="robots" content="noindex, follow">
<!-- GitHub Pages serves this file for any missing path, so every asset is root-absolute. -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F6F6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    try {
      var t = localStorage.getItem('widgetdeck-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
@font-face { font-family: "Geist"; src: url(/fonts/Geist-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url(/fonts/GeistMono-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
:root { --bg: #F6F6F7; --ink: #18181B; --muted: #52525B; --line: #E0E0E5; --accent: #BE185D; --accent-hover: #A3134F; --on-accent: #FFF7FA; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0E0E10; --ink: #EDEDF0; --muted: #A1A1AA; --line: #2A2A30; --accent: #EE7AB0; --accent-hover: #F59BC4; --on-accent: #1A0A11; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0E0E10; --ink: #EDEDF0; --muted: #A1A1AA; --line: #2A2A30; --accent: #EE7AB0; --accent-hover: #F59BC4; --on-accent: #1A0A11; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 400 17px/1.6 "Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
main { width: 100%; max-width: 520px; display: grid; gap: 20px; }
.mark { width: 44px; height: 44px; }
.code { font-family: "Geist Mono", ui-monospace, Consolas, monospace; font-size: 14px; color: var(--muted); }
h1 { margin: 0; font-size: clamp(32px, 6vw, 44px); line-height: 1.08; letter-spacing: -.035em; font-weight: 650; }
p { margin: 0; color: var(--muted); }
a.btn { justify-self: start; display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 550; font-size: 15px; padding: 11px 20px; border-radius: 999px; transition: background-color .2s, transform .2s; }
a.btn:hover { background: var(--accent-hover); }
a.btn:active { transform: scale(.98); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="17" height="22" rx="4" transform="rotate(-10 11.5 18)" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="12" y="3" width="17" height="22" rx="4" transform="rotate(8 20.5 14)" fill="var(--accent)"/></svg>
  <span class="code">404</span>
  <h1>Page not found.</h1>
  <p>The page you asked for doesn't exist. Every app is on the home page, with screenshots and a demo.</p>
  <a class="btn" href="/">Back to Widgetdeck</a>
</main>
</body>
</html>
